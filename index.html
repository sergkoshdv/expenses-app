<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Расходы</title>

  <style>
    :root {
      --bg: #f6f7f9;
      --card: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --accent: #2563eb;
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      max-height: 90vh;
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 12px;
      text-align: center;
    }

    .field {
      margin-bottom: 10px;
    }

    .field input {
      width: 100%;
      padding: 12px 14px;
      font-size: 18px;
      border-radius: 12px;
      border: 1px solid #e5e7eb;
      outline: none;
    }

    .field input:focus {
      border-color: var(--accent);
    }

    .amount input {
      font-size: 22px;
      font-weight: 600;
    }

    button {
      width: 100%;
      padding: 14px;
      font-size: 18px;
      font-weight: 600;
      border: none;
      border-radius: 14px;
      background: var(--accent);
      color: white;
      cursor: pointer;
      margin-top: 4px;
    }

    button:active {
      opacity: 0.9;
    }

    .hint {
      text-align: center;
      font-size: 12px;
      color: var(--muted);
      margin-top: 6px;
    }
  </style>
</head>

<body>
  <div class="card">
    <div class="title">Новый расход</div>

    <form id="form" action="https://script.google.com/macros/s/AKfycbz4DxBN86XwNICi0yU4ggLpBCGsn39f3Hj7IIlMYYJRufcAAs2QyQNR498MdX5ZLKoV/exec" method="post" target="hidden_iframe">
      <div class="field amount">
        <input type="number" id="amount" name="amount" placeholder="Сумма" inputmode="decimal" required />
      </div>

      <div class="field">
        <input list="categories" id="category" name="category" placeholder="Категория" required />
        <datalist id="categories"></datalist>
      </div>

      <div class="field">
        <input type="text" id="comment" name="comment" placeholder="Комментарий (необязательно)" />
      </div>

      <button type="submit">Добавить</button>
    </form>
  </div>

  <iframe name="hidden_iframe" style="display:none;"></iframe>

  <script>
    const amountInput = document.getElementById("amount");
    const categoryInput = document.getElementById("category");
    const datalist = document.getElementById("categories");

    // Загружаем категории из localStorage
    let categories = JSON.parse(localStorage.getItem("cats") || "[]");

    function renderCategories() {
      datalist.innerHTML = "";
      categories.forEach(c => {
        const option = document.createElement("option");
        option.value = c;
        datalist.appendChild(option);
      });
    }

    renderCategories();
    amountInput.focus();

    // Сохраняем новую категорию при отправке формы
    document.getElementById("form").addEventListener("submit", () => {
      const category = categoryInput.value.trim();
      if (category && !categories.includes(category)) {
        categories.push(category);
        localStorage.setItem("cats", JSON.stringify(categories));
        renderCategories();
      }

      // Очищаем поля после отправки и автофокус
      setTimeout(() => {
        amountInput.value = "";
        categoryInput.value = "";
        document.getElementById("comment").value = "";
        amountInput.focus();
      }, 100);
    });
  </script>
</body>
</html>
